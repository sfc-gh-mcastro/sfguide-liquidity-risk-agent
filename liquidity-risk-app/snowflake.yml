definition_version: "2"

entities:
  liquidity_risk_dashboard:
    type: snowflake-app
    identifier:
      name: LIQUIDITY_RISK_DASHBOARD
      database: LIQUIDITY_RISK_DB
      schema: PUBLIC
    artifacts:
      - src: ./*
        dest: ./
        ignore:
          - node_modules
          - .env*
          - __pycache__
          - "*.pyc"
          - .next
          - .git
          - snowflake.log

    query_warehouse: LIQUIDITY_RISK_WH
    build_compute_pool:
      name: SYSTEM_COMPUTE_POOL_CPU
    code_stage:
      name: LIQUIDITY_RISK_DASHBOARD_CODE
